name: Build & Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9A-Za-z.\-]+' ofnoa-social-embed.php)
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from the plugin header." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version $VERSION"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint every PHP file
        if: steps.check.outputs.exists == 'false'
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Build the installable zip
        if: steps.check.outputs.exists == 'false'
        run: |
          BUILD="$RUNNER_TEMP/build/ofnoa-social-embed"
          mkdir -p "$BUILD"
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude '.gitignore' \
                   --exclude '.distignore' \
                   --exclude 'node_modules' \
                   --exclude '*.zip' \
                   ./ "$BUILD/"
          ( cd "$RUNNER_TEMP/build" && zip -rq "$GITHUB_WORKSPACE/ofnoa-social-embed.zip" ofnoa-social-embed )
          ls -lh ofnoa-social-embed.zip

      - name: Tag the release
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish the GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ofnoa-social-embed.zip
